name: DevOps CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with JUnit report
        run: |
          mkdir -p test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit-node-${{ matrix.node-version }}.xml \
            test/*.test.js

      - name: Build frontend bundle
        run: npm run build

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-node-${{ matrix.node-version }}
          path: test-results/junit-node-${{ matrix.node-version }}.xml
          retention-days: 14

  build-and-push:
    name: Build & Publish Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          else
            IMAGE_TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "APP_VERSION=${{ steps.meta.outputs.image_tag }}" \
            -t "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}" \
            .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}"

  deploy:
    name: Deploy & Healthcheck
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy published image without rebuilding
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          JWT_SECRET: ci_test_env_jwt_secret_minimum_32_characters_long
          POSTGRES_USER: fixcraft
          POSTGRES_PASSWORD: ci_test_postgres_password
          POSTGRES_DB: fixcraft
        run: |
          docker compose pull app
          docker compose up -d --no-build --wait
          docker compose ps

      - name: Verify live /health endpoint
        run: |
          for i in $(seq 1 15); do
            if response=$(curl --fail --silent http://localhost:3001/health); then
              echo "Health response: ${response}"
              echo "${response}" | grep -q '"status":"ok"'
              echo "${response}" | grep -q '"postgres":"connected"'
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Tear down test deployment
        if: always()
        env:
          JWT_SECRET: ci_test_env_jwt_secret_minimum_32_characters_long
          POSTGRES_PASSWORD: ci_test_postgres_password
        run: docker compose down -v
